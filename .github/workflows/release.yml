# Trusted lane. The ONLY workflow allowed to hold id-token: write (docs/adr/0007).
#
# - Runs on version tags, or manually from main as a dry run (no release is created).
# - Never checks out pull-request code; refuses any commit that is not on main.
# - Every job uses the protected "release" environment, which needs a maintainer's approval.
# - Produces: binaries, source archive, SBOM, a keyless cosign signature over the
#   checksums, and SLSA build provenance.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version, e.g. 0.0.1 (nothing is published)"
        required: true
        default: "0.0.1"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build-sign-attest
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write      # keyless signing and provenance, nothing else
      attestations: write  # store the SLSA provenance attestation
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Refuse to run from anywhere but main or a version tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dry runs may only be started from main"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse commits that are not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      - name: Work out the version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${REF_NAME#v}"; else v="${INPUT_VERSION}-dryrun"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::Invalid version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the newest Go release, so the standard library has every
          # security fix. go.mod sets the minimum (1.26). Renovate tracks this line.
          go-version: "1.27.x"
          cache: false

      - name: Build binaries and source archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GOFLAGS: -mod=readonly -trimpath
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -buildid= -X github.com/redfilade/redfilade/internal/version.Version=${VERSION} -X github.com/redfilade/redfilade/internal/version.Commit=${GITHUB_SHA}"
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -ldflags "$LDFLAGS" \
              -o "dist/redfilade_${VERSION}_${os}_${arch}${ext}" ./cmd/redfilade
          done
          git archive --format=tar.gz --prefix="redfilade-${VERSION}/" \
            -o "dist/redfilade_${VERSION}_source.tar.gz" "$GITHUB_SHA"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/redfilade_${{ steps.meta.outputs.version }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: sha256sum redfilade_* > "redfilade_${VERSION}_checksums.txt"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checksums (keyless) and verify the signature
        working-directory: dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          f="redfilade_${VERSION}_checksums.txt"
          cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          cosign verify-blob "$f" --bundle "${f}.sigstore.json" \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/redfilade_${{ steps.meta.outputs.version }}_checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  range-proof:
    # Phase 1 acceptance: run the Range gate in real cells, then sign the
    # evidence keylessly and prove the signature verifies.
    name: range-proof
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write   # keyless signing of the evidence, nothing else
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse commits that are not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build the CLI and the Range targets
        env:
          GOFLAGS: -mod=readonly -trimpath
          CGO_ENABLED: "0"
        run: |
          go build -o "$RUNNER_TEMP/redfilade" ./cmd/redfilade
          scripts/build-targets.sh
      - name: Range gate in real cells
        run: '"$RUNNER_TEMP/redfilade" range gate --yes --out proof --junit proof/range-gate.xml'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the evidence and verify every signature
        working-directory: proof
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          sha256sum evidence-*.json range-gate.xml > proof-checksums.txt
          cosign sign-blob --yes --bundle proof-checksums.txt.sigstore.json proof-checksums.txt
          cosign verify-blob proof-checksums.txt --bundle proof-checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --strict proof-checksums.txt
      - name: Sign each scenario as a pack and verify it with the CLI
        # Phase 2: a pack signature binds the exact scenario.json bytes to this
        # workflow identity. `redfilade pack verify` checks the same identity
        # that `range run DIR` requires before it treats a pack as verified.
        run: |
          for f in scenarios/*/scenario.json; do
            id="$(basename "$(dirname "$f")")"
            mkdir -p "packs/$id"
            cp "$f" "packs/$id/scenario.json"
            cosign sign-blob --yes --bundle "packs/$id/scenario.json.sigstore.json" "packs/$id/scenario.json"
            "$RUNNER_TEMP/redfilade" pack verify "packs/$id"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-packs-${{ needs.build.outputs.version }}
          path: packs/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: range-proof-${{ needs.build.outputs.version }}
          path: proof/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-draft-release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write   # create the GitHub release; no id-token here
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Create a draft release (a maintainer reviews and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
            --title "Redfilade $TAG" \
            --notes "Verify before running: see SECURITY.md, section 'Verifying what we publish'."
