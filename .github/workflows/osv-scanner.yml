# Known-vulnerability scan of every lockfile (OSV database).
name: osv-scanner

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

jobs:
  scan-pr:
    name: osv-scan-pr
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Fork PRs get a read-only token, so results stay in the job log.
      upload-sarif: false
    permissions:
      actions: read          # reusable workflow reads run metadata
      contents: read         # read lockfiles
      security-events: read  # fork PRs cannot upload results

  scan-main:
    name: osv-scan-main
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read            # reusable workflow reads run metadata
      contents: read           # read lockfiles
      security-events: write   # upload results to code scanning
