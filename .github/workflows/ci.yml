# Untrusted lane. Runs on every pull request, including from forks.
# No secrets, no OIDC, read-only token, nothing is published from here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.32.0"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned checksum)
        run: |
          curl -sSLf -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the full git history
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .

  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go: control plane and runner (ADR-003)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the newest Go release, so the standard library has every
          # security fix. go.mod sets the minimum (1.26). Renovate tracks this line.
          go-version: "1.27.x"
          cache: false
      - name: Go vet, build and test (module graph is read-only)
        env:
          GOFLAGS: -mod=readonly
          # The runner image ships PostgreSQL; database tests start a throwaway
          # cluster and must run here rather than skip.
          REDFILADE_REQUIRE_PG: "1"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

      # TypeScript workspace (ADR-003). Install scripts are blocked by pnpm-workspace.yaml.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Python harness (ADR-003). uv refuses packages younger than 7 days.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: false
      - name: uv sync (locked)
        run: |
          uv sync --locked
          uv run python -c "import redfilade_harness"

  range-gate:
    name: range-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build the CLI
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/redfilade" ./cmd/redfilade
      - name: Validate every scenario
        run: '"$RUNNER_TEMP/redfilade" scenario validate'
      - name: Build Range targets (static binaries, FROM scratch)
        run: scripts/build-targets.sh
      - name: Range gate (every vulnerable twin exploited, every secure twin held)
        run: '"$RUNNER_TEMP/redfilade" range gate --yes --out results --junit results/range-gate.xml'
      - name: Builder test against both twins (Phase 1 acceptance)
        run: |
          set +e
          "$RUNNER_TEMP/redfilade" test --image redfilade-target/leaky-errors:vulnerable --level L1 --yes \
            --out results/test-vulnerable --sarif results/test-vulnerable.sarif --junit results/test-vulnerable.xml
          v=$?
          "$RUNNER_TEMP/redfilade" test --image redfilade-target/leaky-errors:secure --level L1 --yes \
            --out results/test-secure --sarif results/test-secure.sarif --junit results/test-secure.xml
          s=$?
          if [ "$v" != 1 ] || [ "$s" != 0 ]; then
            echo "::error::expected vulnerable=1 (findings) and secure=0 (pass), got vulnerable=$v secure=$s"
            exit 1
          fi
      - name: No canary value may appear in any output
        run: |
          if grep -rEo 'CANARY_[A-Z0-9_]+_[A-Z2-7]{26}' results; then
            echo "::error::a raw canary value reached a report"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: range-gate-results
          path: results/
          retention-days: 14

  action-selftest:
    name: action-selftest
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build Range targets
        run: scripts/build-targets.sh
      - name: Action against the vulnerable twin
        id: vulnerable
        uses: ./ # zizmor: ignore[self-repository] -- tests this commit's action.yml; "$/" is not yet understood by actionlint
        with:
          image: redfilade-target/leaky-errors:vulnerable
          sarif: vulnerable.sarif
          fail-on-findings: "false"
      - name: Action against the secure twin
        id: secure
        uses: ./ # zizmor: ignore[self-repository] -- tests this commit's action.yml; "$/" is not yet understood by actionlint
        with:
          image: redfilade-target/leaky-errors:secure
          sarif: secure.sarif
      - name: Check the action's verdicts
        env:
          VULN: ${{ steps.vulnerable.outputs.verdict }}
          SECURE: ${{ steps.secure.outputs.verdict }}
        run: |
          echo "vulnerable=$VULN secure=$SECURE"
          [ "$VULN" = exploited ] && [ "$SECURE" = not_exploited ]
          test -s vulnerable.sarif && test -s secure.sarif

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned checksum)
        run: |
          curl -sSLf -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: false
      - name: zizmor (GitHub Actions security audit)
        run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows action.yml

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
