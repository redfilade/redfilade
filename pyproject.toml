[project]
name = "redfilade-harness"
version = "0.0.0"
description = "Redfilade attack harness and scenario SDK."
readme = "harness/README.md"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-PolyForm-Internal-Use-1.0.0"
license-files = ["LICENSE"]
requires-python = "==3.15.2"
dependencies = []

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "harness/src"
module-name = "redfilade_harness"

[tool.uv]
# Supply-chain policy: ignore anything uploaded to PyPI in the last 7 days.
exclude-newer = "7 days"
# Every resolution is locked with hashes in uv.lock; CI uses `uv sync --locked`.
required-version = ">=0.11"
