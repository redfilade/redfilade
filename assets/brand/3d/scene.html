<body><div id="stage"><canvas id="bg"></canvas><canvas id="gl"></canvas><div id="txt"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'social';
const SIZES = { social:[1280,640], avatar:[1024,1024], banner:[1600,520], mark:[1024,1024] };
const [W,H] = SIZES[mode];
const stage = document.getElementById('stage'); stage.style.width=W+'px'; stage.style.height=H+'px';

// ---------- 2D backdrop: deep navy, red glow, perspective "range" grid ----------
const bg = document.getElementById('bg'); bg.width=W; bg.height=H; const c=bg.getContext('2d');
if (mode !== 'mark') {
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0B1020'); g.addColorStop(1,'#05070C'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const SQ = (mode==='social'||mode==='banner') ? H : W; const GL_LEFT = mode==='social'? 30 : mode==='banner'? 150 : 0;
  const gx = GL_LEFT + SQ/2, gy = H*0.46;
  g=c.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*0.55); g.addColorStop(0,'rgba(229,56,59,.30)'); g.addColorStop(.35,'rgba(229,56,59,.08)'); g.addColorStop(1,'rgba(229,56,59,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // cool teal 'defence' glow on the far side
  const tx = mode==='avatar'? W*0.92 : W*0.9, ty = mode==='avatar'? H*0.12 : H*0.22;
  g=c.createRadialGradient(tx,ty,0,tx,ty,Math.max(W,H)*0.6); g.addColorStop(0,'rgba(38,190,190,.26)'); g.addColorStop(.4,'rgba(38,170,180,.09)'); g.addColorStop(1,'rgba(38,170,180,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // warm red wash from the opposite corner
  g=c.createRadialGradient(0,0,0,0,0,Math.max(W,H)*0.55); g.addColorStop(0,'rgba(150,40,48,.28)'); g.addColorStop(1,'rgba(150,40,48,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  // perspective floor grid
  const hy=H*0.66, vx=gx; c.lineWidth=1;
  for(let i=-30;i<=30;i++){ const x=vx+i*W*0.06; c.strokeStyle=`rgba(242,72,75,${0.10-Math.abs(i)*0.002})`;
    c.beginPath(); c.moveTo(vx+i*6,hy); c.lineTo(x*1.0+(x-vx)*2.2,H); c.stroke(); }
  for(let k=0;k<14;k++){ const t=Math.pow(k/13,2.1); const y=hy+(H-hy)*t; c.strokeStyle=`rgba(242,72,75,${0.03+0.10*t})`;
    c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // fade grid into horizon
  g=c.createLinearGradient(0,hy-4,0,hy+70); g.addColorStop(0,'rgba(8,11,20,1)'); g.addColorStop(1,'rgba(8,11,20,0)'); c.fillStyle=g; c.fillRect(0,hy-4,W,74);
  // radar rings around the sentinel
  c.strokeStyle='rgba(244,239,230,.06)'; c.lineWidth=1.2;
  for(const r of [0.30,0.42,0.56]){ c.beginPath(); c.arc(gx,gy,Math.min(W,H)*r,0,Math.PI*2); c.stroke(); }
  // vignette
  g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
}

// ---------- 3D sentinel ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias:true, alpha:true, preserveDrawingBuffer:true });
const SQ2 = (mode==='social'||mode==='banner') ? H : W; const GLL = mode==='social'? 30 : mode==='banner'? 150 : 0;
renderer.setPixelRatio(1); renderer.setSize(SQ2, mode==='avatar'||mode==='mark'? H : H); document.getElementById('gl').style.left=GLL+'px';
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const RED = new THREE.MeshPhysicalMaterial({ color:0xD62E35, roughness:.34, clearcoat:1, clearcoatRoughness:.14 });
const REDDEEP = new THREE.MeshPhysicalMaterial({ color:0xA8222A, roughness:.45, clearcoat:.8, clearcoatRoughness:.2 });
const CREAM = new THREE.MeshPhysicalMaterial({ color:0xF4EFE6, roughness:.28, clearcoat:1, clearcoatRoughness:.1 });
const GLASS = new THREE.MeshPhysicalMaterial({ color:0x0C1018, roughness:.06, metalness:.2, clearcoat:1, clearcoatRoughness:.02, reflectivity:1 });
const GLOW = new THREE.MeshBasicMaterial({ color:0xFF2A35, toneMapped:false });
function haloTex(){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,70,75,1)');g.addColorStop(.25,'rgba(255,40,50,.55)');g.addColorStop(1,'rgba(255,30,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}
const HALO=new THREE.SpriteMaterial({map:haloTex(),blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,transparent:true});
function halo(x,y,z,s){const sp=new THREE.Sprite(HALO);sp.position.set(x,y,z);sp.scale.set(s,s,1);return sp;}

const bot = new THREE.Group(); scene.add(bot);
// Polygon with a rounding radius per vertex (quadratic corners) -> soft, toy-like outlines.
function roundedShape(pts) {
  const sh = new THREE.Shape(); const n = pts.length;
  const at = (i) => pts[(i + n) % n];
  const towards = (p, q, r) => { const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy); const k=Math.min(r, L/2)/L; return [p[0]+dx*k, p[1]+dy*k]; };
  for (let i = 0; i < n; i++) {
    const p = at(i), r = p[2] || 0;
    const a = towards(p, at(i-1), r), b = towards(p, at(i+1), r);
    if (i === 0) sh.moveTo(a[0], a[1]); else sh.lineTo(a[0], a[1]);
    sh.quadraticCurveTo(p[0], p[1], b[0], b[1]);
  }
  sh.closePath(); return sh;
}
const puffy = (t, s, segs=18) => ({ bevelEnabled:true, bevelThickness:t, bevelSize:s, bevelSegments:segs, curveSegments:64 });

// Shield: rounded battlements, curved shoulders, soft tip
const SHIELD = [
  [-150, 56, 22], [-100, 56, 18], [-100, 30, 12], [100, 30, 12], [100, 56, 18], [150, 56, 22],
  [150, -34, 120], [0, -222, 70], [-150, -34, 120],
];


// ---------- seeded noise + procedural knit ----------
let _seed = 0x5EED1E5;
const rand = () => { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function knitTexture(cols = 18) {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S; const x = cv.getContext('2d');
  const img = x.createImageData(S, S); const d = img.data; const cw = S / cols, rh = cw * 0.62;
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const u = (i % cw) / cw, row = Math.floor(j / rh), v = (j % rh) / rh;
    const lean = (row % 2 ? 1 : -1) * (u - 0.5);
    const stitch = Math.cos((v + lean * 0.9) * Math.PI * 2) * 0.5 + 0.5, rib = Math.sin(u * Math.PI);
    let val = 0.25 + 0.55 * rib * (0.55 + 0.45 * stitch) + (rand() - 0.5) * 0.12;
    val = Math.max(0, Math.min(1, val)) * 255; const k = (j * S + i) * 4; d[k] = d[k + 1] = d[k + 2] = val; d[k + 3] = 255;
  }
  x.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function fabric(color, repeat, sheen = 0xff7070, bump = 1.6) {
  const tex = knitTexture(); tex.repeat.set(repeat[0], repeat[1]);
  return new THREE.MeshPhysicalMaterial({ color, roughness: 0.93, bumpMap: tex, bumpScale: bump, sheen: 1, sheenColor: sheen, sheenRoughness: 0.55 });
}
const HOOD = fabric(0xC92A32, [4, 3]);
const BODY = fabric(0xC92A32, [4, 2]);
const SLEEVE = fabric(0xC92A32, [2, 3]);
const RIB = fabric(0xA8222A, [12, 1], 0xff6060, 2.4);
const DENIM = new THREE.MeshPhysicalMaterial({ color: 0x232A3A, roughness: 0.9, sheen: .4, sheenColor: 0x6a7aa0, bumpMap: knitTexture(48), bumpScale: 0.8 });
const SOCK = fabric(0xEAE4DA, [12, 1], 0xffffff, 2.2);
const SOLE = new THREE.MeshPhysicalMaterial({ color: 0xF2EEE7, roughness: 0.6, clearcoat: .3 });
const SHOE = new THREE.MeshPhysicalMaterial({ color: 0xFBF8F3, roughness: 0.45, clearcoat: .55, clearcoatRoughness: .35 });
const SHOE_RED = new THREE.MeshPhysicalMaterial({ color: 0xD9363C, roughness: 0.42, clearcoat: .7, clearcoatRoughness: .25 });
const LACE = new THREE.MeshPhysicalMaterial({ color: 0xEDE7DD, roughness: 0.85 });
const GLOVE = new THREE.MeshPhysicalMaterial({ color: 0x2B2F38, roughness: 0.7, sheen: .5, sheenColor: 0x8a90a0 });
const SCREEN = new THREE.MeshPhysicalMaterial({ color: 0x06080C, roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03 });
const CORD = new THREE.MeshPhysicalMaterial({ color: 0xF1EBE2, roughness: 0.8, sheen: .6, sheenColor: 0xffffff });

const add = (geo, mat, x, y, z, o = {}) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  if (o.s) m.scale.set(...o.s); if (o.r) m.rotation.set(...o.r); m.castShadow = m.receiveShadow = true; (o.parent || bot).add(m); return m; };

// ---------- sneakers: side profile extruded across the width ----------
function shapeFrom(pts) { return roundedShape(pts); }
const SOLE_PTS = [[-70, 0, 8], [86, 0, 12], [90, 20, 10], [-72, 20, 8]];
const UPPER_PTS = [[-64, 14, 10], [84, 14, 10], [88, 26, 18], [62, 44, 26], [14, 50, 22], [-24, 62, 12], [-58, 66, 14], [-70, 46, 14]];
const HEEL_PTS = [[-72, 14, 8], [-34, 14, 8], [-30, 54, 12], [-58, 68, 12], [-74, 46, 12]];
for (const sx of [-1, 1]) {
  const shoe = new THREE.Group(); shoe.position.set(sx * 50, -304, 8); shoe.rotation.y = sx * 0.2; bot.add(shoe);
  const W = 70;
  const mk = (pts, depth, mat, bev, xoff = 0) => { const g = new THREE.ExtrudeGeometry(shapeFrom(pts), { depth, ...puffy(bev, bev * 0.8, 10) });
    const m = new THREE.Mesh(g, mat); m.rotation.y = -Math.PI / 2; m.position.x = depth / 2 + xoff; m.castShadow = m.receiveShadow = true; shoe.add(m); return m; };
  mk(SOLE_PTS, W + 2, SOLE, 6);                 // thick midsole
  mk(UPPER_PTS, W - 16, SHOE, 14);              // rounded upper
  mk(HEEL_PTS, W + 4, SHOE_RED, 9);             // red heel panel, proud of the upper
  // toe cap
  // red side stripes (both sides)
  for (const side of [-1, 1]) {
    const st = new THREE.CatmullRomCurve3([new THREE.Vector3(side * 40, 28, -46), new THREE.Vector3(side * 41, 34, -6), new THREE.Vector3(side * 37, 44, 34)]);
    add(new THREE.TubeGeometry(st, 32, 6, 12, false), SHOE_RED, 0, 0, 0, { parent: shoe });
  }
  // red tongue rising from the laces
  add(new RoundedBoxGeometry(34, 30, 14, 4, 6), SHOE_RED, 0, 74, -18, { r: [-0.5, 0, 0], parent: shoe });
  // laces across the tongue
  for (let k = 0; k < 4; k++) add(new THREE.CapsuleGeometry(3.4, 30, 4, 10), LACE, 0, 59 + k * 3.2, 42 - k * 14, { r: [0, 0, Math.PI / 2], parent: shoe });
  // padded collar + sock
  add(new THREE.TorusGeometry(24, 8, 16, 40), SHOE, 0, 76, -42, { r: [Math.PI / 2 - 0.15, 0, 0], s: [1, 1.15, 1], parent: shoe });
  add(new THREE.CylinderGeometry(25, 26, 70, 32), SOCK, 0, 108, -40, { parent: shoe });
}

// ---------- shorts with rolled cuffs ----------
add(new THREE.CapsuleGeometry(82, 26, 10, 48), DENIM, 0, -150, 0, { s: [1.08, .72, .84] });
for (const sx of [-1, 1]) {
  add(new THREE.CylinderGeometry(42, 47, 46, 40), DENIM, sx * 46, -180, 0, { s: [1, 1, .9] });
  add(new THREE.TorusGeometry(45, 7, 14, 40), DENIM, sx * 46, -203, 0, { r: [Math.PI / 2, 0, 0], s: [1, .9, 1] });
}

// ---------- hoodie torso ----------
add(new THREE.CapsuleGeometry(100, 62, 12, 56), BODY, 0, -50, 0, { s: [1.04, 1, .82] });
add(new THREE.CylinderGeometry(98, 96, 22, 56), RIB, 0, -112, 0, { s: [1.04, 1, .82] });
// kangaroo pocket: a flat patch on the belly, open at the sides
const POCKET = [[-58, 30, 10], [58, 30, 10], [78, -26, 14], [-78, -26, 14]];
const pocket = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(POCKET), { depth: 4, ...puffy(6, 5, 8) }), BODY);
pocket.position.set(0, -84, 76); pocket.rotation.x = -0.1; pocket.castShadow = true; bot.add(pocket);
const seam = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-56, -54, 86), new THREE.Vector3(0, -55, 88), new THREE.Vector3(56, -54, 86)]), 24, 1.6, 8, false), RIB);
bot.add(seam);
// sleeves that bend at the elbow, ribbed cuffs, gloved hands entering the pocket
for (const sx of [-1, 1]) {
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(sx * 86, 6, 4), new THREE.Vector3(sx * 112, -34, 18),
    new THREE.Vector3(sx * 104, -74, 46), new THREE.Vector3(sx * 70, -84, 64)]);
  bot.add(Object.assign(new THREE.Mesh(new THREE.TubeGeometry(path, 48, 30, 32, false), SLEEVE), { castShadow: true }));
  add(new THREE.SphereGeometry(30, 32, 24), SLEEVE, sx * 86, 6, 4);                                   // shoulder cap
  const end = path.getPoint(1), tan = path.getTangent(1);
  const cuff = add(new THREE.CylinderGeometry(27, 28, 18, 32), RIB, end.x, end.y, end.z);
  cuff.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
  add(new THREE.SphereGeometry(21, 24, 16), GLOVE, end.x + tan.x * 16, end.y + tan.y * 16, end.z - 6, { s: [1, .9, 1] }); // hidden inside the pocket
}
// chest badge on a cream patch
add(new RoundedBoxGeometry(50, 56, 8, 4, 4), SOCK, -46, -10, 80, { r: [-0.12, -0.14, 0] });
{ const b = new THREE.Group(); b.position.set(-46, -2, 86); b.rotation.set(-0.12, -0.14, 0); b.scale.setScalar(0.165); bot.add(b);
  b.add(new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(SHIELD), { depth: 20, ...puffy(12, 10) }), RED));
  const chev = new THREE.CatmullRomCurve3([new THREE.Vector3(-50,-60,36), new THREE.Vector3(-14,-88,36), new THREE.Vector3(-50,-116,36)], false, 'catmullrom', 0.02);
  b.add(new THREE.Mesh(new THREE.TubeGeometry(chev, 32, 12, 16, false), CREAM));
  const u = new THREE.Mesh(new THREE.CapsuleGeometry(12, 34, 6, 16), CREAM); u.rotation.z = Math.PI / 2; u.position.set(26, -116, 36); b.add(u); }
// drawstrings
for (const sx of [-1, 1]) {
  const c = new THREE.CatmullRomCurve3([new THREE.Vector3(sx * 24, 40, 74), new THREE.Vector3(sx * 27, 6, 88), new THREE.Vector3(sx * 24, -28, 90)]);
  bot.add(new THREE.Mesh(new THREE.TubeGeometry(c, 24, 4.5, 12, false), CORD));
  add(new THREE.CapsuleGeometry(5.5, 12, 6, 12), CORD, sx * 24, -36, 90);
}

// ---------- hood with a wide oval face opening ----------
const HR = 150, CUT = 0.98, HS = [1.14, 1, .98];
const hoodGeo = new THREE.SphereGeometry(HR, 112, 72, 0, Math.PI * 2, CUT, Math.PI - CUT);
const hood = add(hoodGeo, HOOD, 0, 156, -14, { s: HS, r: [Math.PI / 2, 0, 0] });
const inside = new THREE.Mesh(hoodGeo, new THREE.MeshStandardMaterial({ color: 0x2a080b, roughness: 1, side: THREE.BackSide }));
inside.position.copy(hood.position); inside.scale.copy(hood.scale); inside.rotation.copy(hood.rotation); bot.add(inside);
const openR = HR * Math.sin(CUT), openZ = -14 + HR * Math.cos(CUT) * HS[2];
// soft rolled edge of the hood around the opening
add(new THREE.TorusGeometry(openR, 12, 24, 120), HOOD, 0, 156, openZ + 2, { s: [HS[0], .92, 1] });
// glossy TV-style face screen, wider than tall, set inside the hood
const FY = 152, SR = openR * 0.97;
add(new THREE.SphereGeometry(SR, 112, 72), SCREEN, 0, FY, openZ - 46, { s: [1.13, .86, .6] });
const faceZ = openZ - 46 + SR * .6;
// eyes: soft glowing ovals; the right one carries a faint targeting reticle
for (const ex of [-44, 44]) {
  add(new THREE.SphereGeometry(20, 40, 24), GLOW, ex, FY + 4, faceZ - 6, { s: [1.35, .82, .3] });
  bot.add(halo(ex, FY + 4, faceZ + 4, 120));
}
const RET = new THREE.MeshBasicMaterial({ color: 0xFF5A60, transparent: true, opacity: .75, toneMapped: false });
add(new THREE.TorusGeometry(36, 1.6, 12, 64), RET, 44, FY + 4, faceZ - 3);
for (const [dx, dy, rz] of [[0, 44, 0], [0, -44, 0], [50, 0, Math.PI / 2], [-50, 0, Math.PI / 2]])
  add(new THREE.CapsuleGeometry(1.5, 9, 4, 8), RET, 44 + dx, FY + 4 + dy, faceZ - 3, { r: [0, 0, rz] });
const faceLight = new THREE.PointLight(0xff3a3a, 2.2e3, 200, 2); faceLight.position.set(0, FY, faceZ + 40); bot.add(faceLight);

// lights
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a0a0c, 0.35));
const key=new THREE.DirectionalLight(0xfff4ea, 2.0); key.position.set(-260,420,520); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-400,right:400,top:400,bottom:-400,near:1,far:2000}); scene.add(key);
const rim=new THREE.DirectionalLight(0xff4044, 3.2); rim.position.set(380,160,-420); scene.add(rim);
const rim2=new THREE.DirectionalLight(0x3fd6d0, 1.6); rim2.position.set(-420,60,-300); scene.add(rim2);
// contact shadow
const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.ShadowMaterial({opacity:.35}));
shadowPlane.rotation.x=-Math.PI/2; shadowPlane.position.y=-304; shadowPlane.receiveShadow=true; scene.add(shadowPlane);

bot.rotation.set(0.04,-0.38,0);

// camera framing per mode
const cam=new THREE.PerspectiveCamera(30, 1, 10, 5000);
const frame = { social:{x:0,y:20,d:1520}, avatar:{x:0,y:20,d:1450}, banner:{x:0,y:4,d:1440}, mark:{x:0,y:44,d:1420} }[mode];
cam.position.set(frame.x, frame.y+120, frame.d); cam.lookAt(frame.x, frame.y, 0);
if (q.get('debug')==='shoes'){ cam.position.set(520,-190,420); cam.lookAt(0,-265,10); cam.fov=24; cam.updateProjectionMatrix(); }
renderer.render(scene, cam);

// ---------- wordmark ----------
const txt=document.getElementById('txt');
function word(left, top, size, tagSize, tagTop, align){
  txt.innerHTML = `<div class="word" style="left:${left}px;top:${top}px;font-size:${size}px"><span class="red">Red</span><span class="cream">filade</span></div>`+
   (tagSize?`<div class="tag" style="left:${left+size*0.03}px;top:${tagTop}px;font-size:${tagSize}px">Open MCP <b>red-team</b> range</div>`:'');
}
if (mode==='social') word(605, 205, 138, 27, 395);
if (mode==='banner') word(700, 140, 168, 33, 350);
document.fonts.ready.then(()=>{ document.title='ready'; });
</script></body></html>
