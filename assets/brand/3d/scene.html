<body><div id="stage"><canvas id="bg"></canvas><canvas id="gl"></canvas><div id="txt"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'social';
const SIZES = { social:[1280,640], avatar:[1024,1024], banner:[1600,520], mark:[1024,1024] };
const [W,H] = SIZES[mode];
const stage = document.getElementById('stage'); stage.style.width=W+'px'; stage.style.height=H+'px';

// ---------- 2D backdrop: deep navy, red glow, perspective "range" grid ----------
const bg = document.getElementById('bg'); bg.width=W; bg.height=H; const c=bg.getContext('2d');
if (mode !== 'mark') {
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0B1020'); g.addColorStop(1,'#05070C'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const SQ = (mode==='social'||mode==='banner') ? H : W; const GL_LEFT = mode==='social'? 30 : mode==='banner'? 150 : 0;
  const gx = GL_LEFT + SQ/2, gy = H*0.46;
  g=c.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*0.55); g.addColorStop(0,'rgba(229,56,59,.30)'); g.addColorStop(.35,'rgba(229,56,59,.08)'); g.addColorStop(1,'rgba(229,56,59,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // cool teal 'defence' glow on the far side
  const tx = mode==='avatar'? W*0.92 : W*0.9, ty = mode==='avatar'? H*0.12 : H*0.22;
  g=c.createRadialGradient(tx,ty,0,tx,ty,Math.max(W,H)*0.6); g.addColorStop(0,'rgba(38,190,190,.26)'); g.addColorStop(.4,'rgba(38,170,180,.09)'); g.addColorStop(1,'rgba(38,170,180,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // warm red wash from the opposite corner
  g=c.createRadialGradient(0,0,0,0,0,Math.max(W,H)*0.55); g.addColorStop(0,'rgba(150,40,48,.28)'); g.addColorStop(1,'rgba(150,40,48,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  // perspective floor grid
  const hy=H*0.66, vx=gx; c.lineWidth=1;
  for(let i=-30;i<=30;i++){ const x=vx+i*W*0.06; c.strokeStyle=`rgba(242,72,75,${0.10-Math.abs(i)*0.002})`;
    c.beginPath(); c.moveTo(vx+i*6,hy); c.lineTo(x*1.0+(x-vx)*2.2,H); c.stroke(); }
  for(let k=0;k<14;k++){ const t=Math.pow(k/13,2.1); const y=hy+(H-hy)*t; c.strokeStyle=`rgba(242,72,75,${0.03+0.10*t})`;
    c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // fade grid into horizon
  g=c.createLinearGradient(0,hy-4,0,hy+70); g.addColorStop(0,'rgba(8,11,20,1)'); g.addColorStop(1,'rgba(8,11,20,0)'); c.fillStyle=g; c.fillRect(0,hy-4,W,74);
  // radar rings around the sentinel
  c.strokeStyle='rgba(244,239,230,.06)'; c.lineWidth=1.2;
  for(const r of [0.30,0.42,0.56]){ c.beginPath(); c.arc(gx,gy,Math.min(W,H)*r,0,Math.PI*2); c.stroke(); }
  // vignette
  g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
}

// ---------- 3D sentinel ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias:true, alpha:true, preserveDrawingBuffer:true });
const SQ2 = (mode==='social'||mode==='banner') ? H : W; const GLL = mode==='social'? 30 : mode==='banner'? 150 : 0;
renderer.setPixelRatio(1); renderer.setSize(SQ2, mode==='avatar'||mode==='mark'? H : H); document.getElementById('gl').style.left=GLL+'px';
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const RED = new THREE.MeshPhysicalMaterial({ color:0xD62E35, roughness:.34, clearcoat:1, clearcoatRoughness:.14 });
const REDDEEP = new THREE.MeshPhysicalMaterial({ color:0xA8222A, roughness:.45, clearcoat:.8, clearcoatRoughness:.2 });
const CREAM = new THREE.MeshPhysicalMaterial({ color:0xF4EFE6, roughness:.28, clearcoat:1, clearcoatRoughness:.1 });
const GLASS = new THREE.MeshPhysicalMaterial({ color:0x0C1018, roughness:.06, metalness:.2, clearcoat:1, clearcoatRoughness:.02, reflectivity:1 });
const GLOW = new THREE.MeshBasicMaterial({ color:0xFF2A35, toneMapped:false });
function haloTex(){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,70,75,1)');g.addColorStop(.25,'rgba(255,40,50,.55)');g.addColorStop(1,'rgba(255,30,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}
const HALO=new THREE.SpriteMaterial({map:haloTex(),blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,transparent:true});
function halo(x,y,z,s){const sp=new THREE.Sprite(HALO);sp.position.set(x,y,z);sp.scale.set(s,s,1);return sp;}

const bot = new THREE.Group(); scene.add(bot);
// Polygon with a rounding radius per vertex (quadratic corners) -> soft, toy-like outlines.
function roundedShape(pts) {
  const sh = new THREE.Shape(); const n = pts.length;
  const at = (i) => pts[(i + n) % n];
  const towards = (p, q, r) => { const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy); const k=Math.min(r, L/2)/L; return [p[0]+dx*k, p[1]+dy*k]; };
  for (let i = 0; i < n; i++) {
    const p = at(i), r = p[2] || 0;
    const a = towards(p, at(i-1), r), b = towards(p, at(i+1), r);
    if (i === 0) sh.moveTo(a[0], a[1]); else sh.lineTo(a[0], a[1]);
    sh.quadraticCurveTo(p[0], p[1], b[0], b[1]);
  }
  sh.closePath(); return sh;
}
const puffy = (t, s, segs=18) => ({ bevelEnabled:true, bevelThickness:t, bevelSize:s, bevelSegments:segs, curveSegments:64 });

// Shield: rounded battlements, curved shoulders, soft tip
const SHIELD = [
  [-150, 56, 22], [-100, 56, 18], [-100, 30, 12], [100, 30, 12], [100, 56, 18], [150, 56, 22],
  [150, -34, 120], [0, -222, 70], [-150, -34, 120],
];


// ---------- procedural knit texture (rib columns + stitch rows + fibre noise) ----------
let _seed = 0x5EED1E5;
const rand = () => { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function knitTexture(cols = 18) {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S; const x = cv.getContext('2d');
  const img = x.createImageData(S, S); const d = img.data;
  const cw = S / cols, rh = cw * 0.62;
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const u = (i % cw) / cw, row = Math.floor(j / rh), v = (j % rh) / rh;
    const lean = (row % 2 ? 1 : -1) * (u - 0.5);              // V-shaped stitch
    const stitch = Math.cos((v + lean * 0.9) * Math.PI * 2) * 0.5 + 0.5;
    const rib = Math.sin(u * Math.PI);                         // rounded column
    let val = 0.25 + 0.55 * rib * (0.55 + 0.45 * stitch) + (rand() - 0.5) * 0.12;
    val = Math.max(0, Math.min(1, val)) * 255; const k = (j * S + i) * 4;
    d[k] = d[k + 1] = d[k + 2] = val; d[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function fabric(color, repeat, sheen = 0xff9a9a) {
  const tex = knitTexture(); tex.repeat.set(repeat[0], repeat[1]);
  return new THREE.MeshPhysicalMaterial({ color, roughness: 0.92, bumpMap: tex, bumpScale: 1.6,
    sheen: 1, sheenColor: sheen, sheenRoughness: 0.55 });
}
const HOOD = fabric(0xC92A32, [4, 3], 0xff7070);
const BODY = fabric(0xC92A32, [4, 2], 0xff7070);
const RIB = fabric(0xA8222A, [10, 1], 0xff6060);
const DENIM = new THREE.MeshPhysicalMaterial({ color: 0x232A3A, roughness: 0.88, sheen: .4, sheenColor: 0x6a7aa0, bumpMap: knitTexture(40), bumpScale: 1 });
const SOLE = new THREE.MeshPhysicalMaterial({ color: 0xF6F2EC, roughness: 0.55, clearcoat: .4 });
const SHOE = new THREE.MeshPhysicalMaterial({ color: 0xFBF8F3, roughness: 0.42, clearcoat: .6, clearcoatRoughness: .3 });
const SHOE_ACC = new THREE.MeshPhysicalMaterial({ color: 0xE5383B, roughness: 0.4, clearcoat: .7 });
const SOCK = fabric(0xE9E3D9, [10, 2], 0xffffff);
const SCREEN = new THREE.MeshPhysicalMaterial({ color: 0x07090D, roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03 });
const CORD = new THREE.MeshPhysicalMaterial({ color: 0xF1EBE2, roughness: 0.8, sheen: .6, sheenColor: 0xffffff });

const add = (geo, mat, x, y, z, opts = {}) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  if (opts.s) m.scale.set(...opts.s); if (opts.r) m.rotation.set(...opts.r); m.castShadow = true; m.receiveShadow = true; bot.add(m); return m; };

// ---------- sneakers ----------
for (const sx of [-1, 1]) {
  const x = sx * 48;
  add(new RoundedBoxGeometry(80, 20, 132, 8, 10), SOLE, x, -254, 16);                                       // sole
  add(new THREE.CapsuleGeometry(31, 70, 12, 32), SHOE, x, -226, 14, { r: [Math.PI / 2, 0, 0], s: [1.18, 1, .9] }); // rounded upper
  add(new THREE.CapsuleGeometry(10, 46, 8, 16), SHOE_ACC, x + sx * 34, -228, 6, { r: [Math.PI / 2, 0, 0] });   // side stripe
  add(new THREE.SphereGeometry(16, 24, 16), SHOE_ACC, x, -224, -36, { s: [1.6, 1, .8] });                      // heel tab
  add(new THREE.CylinderGeometry(24, 26, 26, 32), SOCK, x, -196, -2);                                         // sock cuff
}
// ---------- shorts ----------
add(new THREE.CapsuleGeometry(80, 26, 10, 48), DENIM, 0, -146, 0, { s: [1.06, .7, .82] });
for (const sx of [-1, 1]) add(new THREE.CylinderGeometry(40, 44, 44, 40), DENIM, sx * 46, -176, 0, { s: [1, 1, .9] });

// ---------- hoodie body ----------
add(new THREE.CapsuleGeometry(98, 66, 12, 48), BODY, 0, -52, 0, { s: [1.02, 1, .8] });
add(new THREE.CylinderGeometry(96, 94, 24, 48), RIB, 0, -112, 0, { s: [1, 1, .8] });            // waist rib
add(new THREE.CapsuleGeometry(28, 76, 10, 32), BODY, 0, -84, 62, { r: [0, 0, Math.PI / 2], s: [1, 1, .6] }); // kangaroo pocket
// arms into the pocket
for (const sx of [-1, 1]) {
  add(new THREE.CapsuleGeometry(32, 74, 10, 32), BODY, sx * 98, -44, 16, { r: [0.42, 0, sx * 0.62] });
  add(new THREE.CylinderGeometry(30, 30, 18, 32), RIB, sx * 66, -84, 52, { r: [0.42 + Math.PI / 2 * 0.0, 0, sx * 0.62] });
}
// chest badge: the Redfilade shield with >_
{
  const patch = add(new RoundedBoxGeometry(52, 58, 8, 4, 4), SOCK, -46, -14, 76, { r: [-0.12, -0.14, 0] });
  const b = new THREE.Group(); b.position.set(-46, -6, 82); b.rotation.set(-0.12, -0.14, 0); b.scale.setScalar(0.17); bot.add(b);
  const sh = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(SHIELD), { depth: 20, ...puffy(12, 10) }), RED); b.add(sh);
  const chev = new THREE.CatmullRomCurve3([new THREE.Vector3(-50,-60,36), new THREE.Vector3(-14,-88,36), new THREE.Vector3(-50,-116,36)], false, 'catmullrom', 0.02);
  b.add(new THREE.Mesh(new THREE.TubeGeometry(chev, 32, 12, 16, false), CREAM));
  const u = new THREE.Mesh(new THREE.CapsuleGeometry(12, 34, 6, 16), CREAM); u.rotation.z = Math.PI / 2; u.position.set(26, -116, 36); b.add(u);
}
// drawstrings
for (const sx of [-1, 1]) {
  const c = new THREE.CatmullRomCurve3([new THREE.Vector3(sx * 22, 46, 70), new THREE.Vector3(sx * 24, 10, 86), new THREE.Vector3(sx * 22, -26, 88)]);
  bot.add(new THREE.Mesh(new THREE.TubeGeometry(c, 24, 4.5, 12, false), CORD));
  add(new THREE.CapsuleGeometry(5.5, 12, 6, 12), CORD, sx * 22, -34, 88);
}

// ---------- hood and face screen ----------
// hood: a sphere with a cap cut out at the front for the face
const HR = 150, CUT = 0.82;
const hoodGeo = new THREE.SphereGeometry(HR, 96, 64, 0, Math.PI * 2, CUT, Math.PI - CUT);
const hood = add(hoodGeo, HOOD, 0, 150, -10, { s: [1.06, 1, .96], r: [Math.PI / 2, 0, 0] });
const hoodInside = new THREE.Mesh(hoodGeo, new THREE.MeshStandardMaterial({ color: 0x3a0d10, roughness: 1, side: THREE.BackSide }));
hoodInside.position.copy(hood.position); hoodInside.scale.copy(hood.scale); hoodInside.rotation.copy(hood.rotation); bot.add(hoodInside);
const openR = HR * Math.sin(CUT), openZ = -10 + HR * Math.cos(CUT) * .96;
const FY = 150, FZ = openZ - 40;
add(new THREE.SphereGeometry(openR * 0.98, 96, 64), SCREEN, 0, FY, FZ, { s: [1.06, 1, .62] });          // glossy face screen
add(new THREE.TorusGeometry(openR, 16, 24, 96), HOOD, 0, FY, openZ, { s: [1.06, 1, 1] });             // soft hood rim
// eyes: a glowing pill and a targeting reticle
const EZ = FZ + openR * 0.98 * .62 - 2;
add(new THREE.CapsuleGeometry(15, 12, 8, 24), GLOW, -40, FY + 6, EZ, { r: [0, 0, Math.PI / 2], s: [1, 1, .4] });
add(new THREE.TorusGeometry(18, 3.4, 20, 64), GLOW, 40, FY + 6, EZ);
add(new THREE.SphereGeometry(5.5, 24, 16), GLOW, 40, FY + 6, EZ + 1);
for (const [dx, dy, w, h] of [[0, 27, 4, 10], [0, -27, 4, 10], [27, 0, 10, 4], [-27, 0, 10, 4]]) {
  add(new THREE.CapsuleGeometry(2, 6, 4, 8), GLOW, 40 + dx, FY + 6 + dy, EZ, { r: [0, 0, w > h ? Math.PI / 2 : 0] });
}
bot.add(halo(-40, FY + 6, EZ + 6, 90)); bot.add(halo(40, FY + 6, EZ + 6, 100));
const faceLight = new THREE.PointLight(0xff3a3a, 2.5e3, 200, 2); faceLight.position.set(0, FY, EZ + 40); bot.add(faceLight);
// antenna from the hood
const stalk = add(new THREE.CylinderGeometry(2.2, 3, 92, 12), CORD, 92, 300, -20, { r: [0, 0, -0.28] });
const bulb = add(new THREE.SphereGeometry(13, 40, 24), GLOW, 105, 344, -20);
bot.add(halo(105, 344, -10, 86));
const bulbLight = new THREE.PointLight(0xff3a3a, 8e3, 260, 2); bulbLight.position.set(105, 344, -20); bot.add(bulbLight);

// lights
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a0a0c, 0.35));
const key=new THREE.DirectionalLight(0xfff4ea, 2.0); key.position.set(-260,420,520); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-400,right:400,top:400,bottom:-400,near:1,far:2000}); scene.add(key);
const rim=new THREE.DirectionalLight(0xff4044, 3.2); rim.position.set(380,160,-420); scene.add(rim);
const rim2=new THREE.DirectionalLight(0x3fd6d0, 1.6); rim2.position.set(-420,60,-300); scene.add(rim2);
// contact shadow
const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.ShadowMaterial({opacity:.35}));
shadowPlane.rotation.x=-Math.PI/2; shadowPlane.position.y=-264; shadowPlane.receiveShadow=true; scene.add(shadowPlane);

bot.rotation.set(0.04,-0.38,0);

// camera framing per mode
const cam=new THREE.PerspectiveCamera(30, 1, 10, 5000);
const frame = { social:{x:0,y:44,d:1500}, avatar:{x:0,y:44,d:1420}, banner:{x:0,y:50,d:1330}, mark:{x:0,y:44,d:1420} }[mode];
cam.position.set(frame.x, frame.y+120, frame.d); cam.lookAt(frame.x, frame.y, 0);
renderer.render(scene, cam);

// ---------- wordmark ----------
const txt=document.getElementById('txt');
function word(left, top, size, tagSize, tagTop, align){
  txt.innerHTML = `<div class="word" style="left:${left}px;top:${top}px;font-size:${size}px"><span class="red">Red</span><span class="cream">filade</span></div>`+
   (tagSize?`<div class="tag" style="left:${left+size*0.03}px;top:${tagTop}px;font-size:${tagSize}px">Open MCP <b>red-team</b> range</div>`:'');
}
if (mode==='social') word(605, 205, 138, 27, 395);
if (mode==='banner') word(700, 140, 168, 33, 350);
document.fonts.ready.then(()=>{ document.title='ready'; });
